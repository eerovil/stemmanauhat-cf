name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer PR push makes the older check pointless. Main runs queue instead,
# so a deploy is never cancelled between the migrations and the deploy.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      WRANGLER_SEND_METRICS: "false"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test
      - name: Keep the traces from a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      # Until scripts/cloudflare-setup.sh has run and its database id is
      # committed, there is nothing to deploy to: say so and stop green.
      - name: Is Cloudflare set up?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then
            echo "::notice::Not deploying: run scripts/cloudflare-setup.sh, commit wrangler.jsonc and add the CLOUDFLARE_* secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: 22
      - if: steps.ready.outputs.ready == 'true'
        run: corepack pnpm install --frozen-lockfile && corepack pnpm run build
      - name: Apply new migrations
        if: steps.ready.outputs.ready == 'true'
        run: corepack pnpm exec wrangler d1 migrations apply stemmanauhat --remote
      - name: Deploy
        if: steps.ready.outputs.ready == 'true'
        run: corepack pnpm exec wrangler deploy
      - name: Check what is live
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -e
          curl -fsS https://stemmanauhat.eerovil.workers.dev/health
          code=$(curl -s -o /dev/null -w '%{http_code}' https://stemmanauhat.eerovil.workers.dev/c/jm)
          case "$code" in
            302) ;;
            # The first deploy runs before scripts/set-worker-secrets.sh: closed, not open.
            503) echo "::warning::The Worker has no secrets yet: run scripts/set-worker-secrets.sh." ;;
            *) echo "choir pages are not gated: $code"; exit 1 ;;
          esac
